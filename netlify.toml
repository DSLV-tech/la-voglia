# Configurazione deploy Netlify (sito statico Astro).
# Le variabili PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY NON vanno qui:
# impostale nel pannello Netlify → Site settings → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
